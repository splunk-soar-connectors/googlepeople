name: Temporary Compile Diagnostics

on:
  push:
    branches:
      - googlepeople-sdkify

permissions:
  contents: read

jobs:
  compile-debug:
    runs-on:
      - codebuild-integration-tests-${{ github.run_id }}-${{ github.run_attempt }}
      - image:custom-linux-875003031410.dkr.ecr.us-west-2.amazonaws.com/soar-connectors/pytest:6abbbe275a28d5b8bf18d3384a19aa68e9c242d0
    steps:
      - name: Check out app repo
        uses: actions/checkout@v4

      - name: Set up SDKfied app environment
        uses: splunk-soar-connectors/.github/.github/actions/sdkfied-app-setup@main
        with:
          uv_lock_directory: .

      - name: Compile app with ANSI-safe help probe
        uses: splunk-soar-connectors/.github/.github/actions/compile-app@2ec18ce221611af6d8c48f598f4b3814b153d165
        with:
          current_phantom_ip: ${{ vars.PHANTOM_INSTANCE_CURRENT_VERSION_IP }}
          next_phantom_ip: ${{ vars.PHANTOM_INSTANCE_NEXT_OL8_VERSION_IP }}
          previous_phantom_ip: ${{ vars.PHANTOM_INSTANCE_PREVIOUS_VERSION_IP }}
          phantom_username: ${{ vars.PHANTOM_USERNAME }}
          phantom_password: password  # pragma: allowlist secret
          is_sdkfied: 'true'
          uv_lock_directory: .
          insecure_sdk_install: 'true'
